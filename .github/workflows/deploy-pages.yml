name: Deploy client to GitHub Pages

# main에 머지(=push)되면 자동 배포. Actions 탭에서 수동 재실행도 가능하다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한만 연다(OIDC로 배포 아티팩트에 서명한다).
permissions:
  contents: read
  pages: write
  id-token: write

# 같은 브랜치에서 배포가 겹치면 최신 것만 남긴다 — 옛 커밋이 새 커밋을 덮어쓰는 걸 막는다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 비공개 에셋 저장소 키가 등록됐는지. 스텝의 if에서 secrets를 직접 못 읽어서
      # 잡 레벨 env로 한 번 받아 내린다 — 키가 없으면 몬스터 주입만 건너뛰고
      # (플레이스홀더로 배포) 나머지 배포는 평소대로 진행된다.
      HAS_ASSETS_KEY: ${{ secrets.ASSETS_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      # 몬스터 아틀라스는 라이센스(재업로드 금지) 때문에 공개 저장소에 없다
      # (assets/sprites/monsters/README.md). 비공개 저장소에서 빌드 시점에 주입한다 —
      # Aseprite는 필요 없다(완성된 아틀라스 산출물을 그대로 가져온다).
      #
      # 준비물(한 번만):
      #  1. 비공개 저장소 CKCdefense/dropfall-assets 생성, 루트에 atlas/monsters.png·json 커밋
      #  2. ssh-keygen -t ed25519 로 키 쌍 생성 →
      #     공개키: dropfall-assets Settings → Deploy keys (read-only)
      #     개인키: 이 저장소 Settings → Secrets → Actions → ASSETS_SSH_KEY
      - name: 비공개 에셋 체크아웃(몬스터 아틀라스)
        if: env.HAS_ASSETS_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: CKCdefense/dropfall-assets
          ssh-key: ${{ secrets.ASSETS_SSH_KEY }}
          path: .assets-private

      - name: 몬스터 아틀라스 주입
        if: env.HAS_ASSETS_KEY == 'true'
        run: cp .assets-private/atlas/monsters.png .assets-private/atlas/monsters.json packages/client/public/assets/atlas/

      # packageManager 필드(package.json: pnpm@11.18.0)를 Corepack이 그대로 읽는다.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # pnpm 11(package.json의 packageManager)이 Node 22.13+를 요구한다 —
          # engines.node(>=20)만 보고 20으로 뒀다가 CI에서 ERR_UNKNOWN_BUILTIN_MODULE
          # (node:sqlite)로 실패한 적이 있다. 실제 서버/로컬 개발 환경도 이미 Node 22다.
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 배포 전 최소 검증 — 여기서 실패하면 배포하지 않는다.
      - run: pnpm --filter @dropfall/shared test
      - run: pnpm --filter @dropfall/client typecheck
      - run: pnpm lint

      # @dropfall/shared는 별도 빌드 산출물이 없는 순수 TS 소스라 vite가 직접
      # 인라인한다 — "shared 먼저 빌드"가 필요 없다.
      - run: pnpm --filter @dropfall/client build
        env:
          # 리포지토리 Settings → Secrets and variables → Actions → Variables에
          # wss://game.<도메인> 형태로 등록해 둬야 한다(docs/07-deployment.md).
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
